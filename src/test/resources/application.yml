spring:
    datasource:
        url: jdbc:h2:mem:miniautorizador;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
        driver-class-name: org.h2.Driver
        username: sa
        password:
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
            ddl-auto: create-drop
        open-in-view: false
management:
    endpoints:
        web:
            exposure:
                include: health,metrics,prometheus
    endpoint:
        health:
            probes:
                enabled: true
            show-details: never
            group:
                liveness:
                    include: livenessState
                readiness:
                    include: readinessState,db
    prometheus:
        metrics:
            export:
                enabled: true
