spring:
    application:
        name: miniautorizador
    datasource:
        url: "${DB_URL:jdbc:mysql://localhost:3306/miniautorizador?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
        driver-class-name: com.mysql.cj.jdbc.Driver
        username: ${DB_USER:root}
        password: "${DB_PASSWORD:}"
    jpa:
        database-platform: org.hibernate.dialect.MySQLDialect
        hibernate:
            ddl-auto: update
        open-in-view: false
server:
    port: 8080
